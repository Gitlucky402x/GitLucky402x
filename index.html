<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gitlucky402x — AI-Powered Meme Token</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

    :root {
      --bg: #000000;
      --fg: #ffffff;
      --dim: #888888;
      --accent: #ffffff;
      --border: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Subtle scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.012) 2px,
        rgba(255,255,255,0.012) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 1.5rem;
    }

    /* Terminal badge */
    .terminal-badge {
      border: 1px solid var(--border);
      padding: 0.45rem 1.2rem;
      font-size: 0.8rem;
      color: var(--fg);
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.1s;
    }

    /* Cursor blink after text */
    .terminal-badge::after {
      content: '█';
      margin-left: 4px;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Main title */
    h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.3s;
    }

    /* Description */
    .desc {
      text-align: center;
      font-size: clamp(0.75rem, 2vw, 0.9rem);
      line-height: 2;
      color: var(--fg);
      max-width: 520px;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.5s;
    }

    .desc a {
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* CTA buttons */
    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.7s;
    }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 0.6rem 1.5rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }

    .btn.primary {
      background: var(--fg);
      color: var(--bg);
    }

    .btn.primary:hover {
      background: transparent;
      color: var(--fg);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--dim);
      flex-wrap: wrap;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 0.9s;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--fg);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <main>
    <div class="terminal-badge">PS C:\Users\gitlucky402x&gt;</div>

    <h1>gitlucky402x</h1>

    <p class="desc">
      gitlucky402x is an AI-powered meme token<br>
      developed openly on Gitlawb.
    </p>

    <div class="actions">
      <a href="#" class="btn primary">Get Started</a>
      <a href="#" class="btn">View Gitlawb</a>
    </div>
  </main>

  <footer>
    <span>© 2026 gitlucky402x. All rights reserved.</span>
    <nav class="footer-links">
      <a href="https://x.com/Gitlucky402x" target="_blank">Twitter</a>
    </nav>
  </footer>

</body>
</html>
